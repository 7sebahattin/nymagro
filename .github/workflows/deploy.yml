name: Canlıya Al (FTP)

# ⚠️ OTOMATİK TETİKLEME BİLEREK KAPATILDI.
#
# Bu akış YALNIZCA elle çalıştırılır. Daha önce push tetikleyicisi vardı ve
# 05.08.2026'da hatalı bir dizine dağıtım yapıp mevcut bir siteyi sildi.
#
# Bilinmesi gereken: SamKirkland/FTP-Deploy-Action bir SENKRONİZASYON
# aracıdır. Hedef dizinde olup depoda olmayan dosyaları SİLER. Bu davranış
# `dangerous-clean-slate: false` ile kapanmaz — o ayar yalnızca "önce her
# şeyi sil, sonra sıfırdan yükle" modunu kapatır. Normal senkronizasyon
# yine de fazlalık dosyaları temizler.
#
# Bu yüzden hedef dizin MUTLAKA doğru olmalı ve ilk çalıştırma her zaman
# deneme modunda yapılmalıdır.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Deneme modu — hiçbir dosya yazılmaz/silinmez, sadece loglanır'
        type: boolean
        default: true
      onay:
        description: 'Gerçek yükleme için hedef dizini birebir yazın (deneme modunda boş bırakın)'
        type: string
        default: ''

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  # ── 1. Kod sağlam mı? Bozuk PHP canlıya gitmesin ──────────────────
  kontrol:
    name: Söz dizimi kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Tüm PHP dosyalarını denetle
        run: |
          hata=0
          while IFS= read -r f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::PHP söz dizimi hatası"
              php -l "$f" || true
              hata=1
            fi
          done < <(find app public -name '*.php')
          if [ "$hata" -ne 0 ]; then
            echo "Söz dizimi hatası var — dağıtım durduruldu."
            exit 1
          fi
          echo "$(find app public -name '*.php' | wc -l) PHP dosyası denetlendi, hata yok."

      - name: Dil dosyalarının anahtarları eşleşiyor mu?
        run: |
          php -r '
            function flat($a, $p = "") {
              $o = [];
              foreach ($a as $k => $v) {
                $key = $p === "" ? $k : "$p.$k";
                if (is_array($v)) { $o = array_merge($o, flat($v, $key)); }
                else { $o[] = $key; }
              }
              return $o;
            }
            $tr = flat(include "app/lang/tr.php");
            $en = flat(include "app/lang/en.php");
            $ru = flat(include "app/lang/ru.php");
            $fark = array_merge(
              array_diff($tr, $en), array_diff($en, $tr),
              array_diff($tr, $ru), array_diff($ru, $tr)
            );
            if ($fark) {
              fwrite(STDERR, "Dil dosyalarında eksik anahtar: " . implode(", ", $fark) . "\n");
              exit(1);
            }
            printf("tr/en/ru: %d anahtar, tam eşleşme.\n", count($tr));
          '

      # Yalnızca sunucuya gidecek kod taranır. Belgeler (*.md), marka
      # kaynakları ve SQL betikleri eski markadan bilinçli olarak söz eder.
      - name: Eski marka kalıntısı var mı?
        run: |
          if grep -rniE "nuverna" app public > /tmp/kalinti.txt; then
            echo "::error::Sunucuya gidecek kodda hâlâ 'nuverna' geçiyor:"
            cat /tmp/kalinti.txt
            exit 1
          fi
          echo "Eski marka kalıntısı yok."

  # ── 2. FTP ile sunucuya yükle ─────────────────────────────────────
  yukle:
    name: FTP ile yükle
    needs: kontrol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Güvenlik kontrolleri
        env:
          SUNUCU: ${{ secrets.FTP_SERVER }}
          KULLANICI: ${{ secrets.FTP_USERNAME }}
          SIFRE: ${{ secrets.FTP_PASSWORD }}
          # Variables veya Secrets — hangisine konduysa oradan okunur
          HEDEF: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          DENEME: ${{ inputs.dry_run }}
          ONAY: ${{ inputs.onay }}
        run: |
          eksik=""
          [ -z "$SUNUCU" ]    && eksik="$eksik FTP_SERVER"
          [ -z "$KULLANICI" ] && eksik="$eksik FTP_USERNAME"
          [ -z "$SIFRE" ]     && eksik="$eksik FTP_PASSWORD"
          if [ -n "$eksik" ]; then
            echo "::error::Eksik repository secret:$eksik"
            exit 1
          fi

          # Hedef dizin ZORUNLU. Varsayılan yok — boş bırakılırsa FTP kökü
          # hedeflenir ve orada başka bir site varsa dosyaları silinir.
          if [ -z "$HEDEF" ]; then
            echo "::error::FTP_SERVER_DIR tanımlı değil."
            echo "Settings → Secrets and variables → Actions altında"
            echo "Variables veya Secrets sekmesine ekleyin; ikisi de kabul edilir."
            echo "Boş bırakmak FTP kök dizinini hedefler ve oradaki dosyaları siler."
            exit 1
          fi

          # Kök dizine dağıtım yasak
          case "$HEDEF" in
            "."|"./"|"/"|"~"|"~/")
              echo "::error::FTP_SERVER_DIR kök dizin olamaz ('$HEDEF')."
              echo "Siteye ait alt dizini yazın, ör. 'nymagro.com/'."
              exit 1 ;;
          esac

          # Secrets'a konduysa GitHub log'da '***' olarak maskeler ve hedefi
          # doğrulayamayız. Harf aralıklı kopya maskeye takılmaz, okunabilir.
          echo "Hedef dizin: $HEDEF"
          echo "Hedef dizin (okunur): $(printf '%s' "$HEDEF" | sed 's/./& /g')"

          if [ "$DENEME" = "true" ]; then
            echo "DENEME MODU — hiçbir dosya yazılmayacak veya silinmeyecek."
          else
            # Gerçek yüklemede hedef dizinin elle teyit edilmesi şart
            if [ "$ONAY" != "$HEDEF" ]; then
              echo "::error::Gerçek yükleme için 'onay' alanına hedef dizini birebir yazmalısınız."
              echo "Beklenen: $HEDEF"
              echo "Girilen:  ${ONAY:-(boş)}"
              exit 1
            fi
            echo "::warning::GERÇEK YÜKLEME — '$HEDEF' dizininde depoda olmayan dosyalar SİLİNECEK."
          fi

      - name: Dosyaları gönder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_SERVER }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port:        ${{ vars.FTP_PORT     || 21 }}
          server-dir:  ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          local-dir:   ./
          dry-run:     ${{ inputs.dry_run }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            brand/**
            db/**
            *.md
            **/.DS_Store
            **/Thumbs.db
            app/config/config.php
            public/uploads/**
            public/error_log
            **/*.log

      - name: Özet
        run: |
          {
            echo "### Dağıtım tamamlandı"
            echo ""
            echo "- Hedef dizin: \`${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Deneme modu: \`${{ inputs.dry_run }}\`"
            echo ""
            echo "**Gönderilmeyenler:** \`app/config/config.php\`, \`public/uploads/\`, \`db/\`, \`brand/\`, \`*.md\`"
          } >> $GITHUB_STEP_SUMMARY
